spring.application.name=rag-demo

spring.datasource.url=jdbc:postgresql://localhost:5432/rag_implmentation
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

rag.chunk-size=500
rag.chunk-overlap=0
rag.documents-path=src/main/resources/documents
rag.retrieval.threshold=0.40
rag.retrieval.limit=8
rag.prompt.system-path=prompts/rag-system.txt
rag.prompt.user-path=prompts/rag-user.txt
rag.prompt.rewriter-system-path=prompts/query-rewriter-system.txt
rag.prompt.reranker-system-path=prompts/reranker-system.txt
rag.prompt.reranker-user-path=prompts/reranker-user.txt
rag.prompt.intent-classifier-path=prompts/intent-classifier-system.txt
rag.query-rewriting.enabled=true

# Reranker: etapa 1 trae candidatos amplios, etapa 2 filtra con un LLM
rag.rerank.enabled=true
rag.rerank.candidate-threshold=0.45
rag.rerank.candidates=15
rag.rerank.top-n=5

ollama.base-url=http://localhost:11434
ollama.model=qwen2.5:3b
ollama.embedding-model=bge-m3
ollama.timeout=120s

# Logs: DEBUG muestra el contexto enviado al LLM; INFO lo oculta
logging.level.com.albaro.rag.demo.service.RagService=INFO
logging.level.com.albaro.rag.demo.service.QueryRewriter=DEBUG
logging.level.com.albaro.rag.demo.service.IntentClassifier=DEBUG
logging.level.com.albaro.rag.demo.service.LlmReranker=DEBUG
# Para ver el SQL que ejecuta Hibernate, cambia a DEBUG
logging.level.org.hibernate.SQL=INFO

# Proveedor del LLM que genera las respuestas: ollama o claude
rag.llm.provider=ollama
anthropic.api-key=${ANTHROPIC_API_KEY}
anthropic.model=claude-haiku-5-5
anthropic.judge-model=claude-haiku-5-5
anthropic.timeout=30s
anthropic.max-retries=3

llm.pricing.claude-haiku-5-5.input=0.10
llm.pricing.claude-haiku-5-5.output=0.50
llm.pricing.claude-sonnet-5-5.input=2.00
llm.pricing.claude-sonnet-5-5.output=10.00

management.endpoints.web.exposure.include=health,metrics